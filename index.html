
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ソフトテニス試合分析</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>ソフトテニス試合分析アプリ</h1>

    <!-- 試合設定画面 -->
    <section id="setup-screen">
        <h2>試合設定</h2>

        <label for="player-a">後衛</label>
        <input type="text" id="player-a" placeholder="選手名を入力">

        <label for="player-b">前衛</label>
        <input type="text" id="player-b" placeholder="選手名を入力">

        <button id="start-button">試合開始</button>
    </section>

    <!-- ポイント記録画面 -->
    <section id="record-screen" hidden>
        <h2>ポイント記録</h2>
        <p id="pair-name"></p>
        
        <div class="score-board">
            <div>
                <p>自ペア</p>
                <p>ゲーム：<span id="own-games">0</span></p>
                <p>ポイント：<span id="own-score">0</span></p>
            </div>
            
            <div>
                <p>相手ペア</p>
                <p>ゲーム：<span id="opponent-games">0</span></p>
                <p>ポイント：<span id="opponent-score">0</span></p>
            </div>
        </div>
        
        <p id="game-number">第1ゲーム</p>
        
        <div class="serve-input">
            <h3>サーブ記録</h3>
            
            <label for="server">サーバー</label>
            <select id="server">
                <option value="A">選手A</option>
                <option value="B">選手B</option>
                <option value="opponent">相手ペア</option>
            </select>
            
            <label for="first-serve">1stサーブ</label>
            <select id="first-serve">
                <option value="unknown">不明・未入力</option>
                <option value="in">成功</option>
                <option value="out">失敗</option>
            </select>
            
            <div id="second-serve-area" hidden>
                <label for="second-serve">2ndサーブ</label>
                <select id="second-serve">
                    <option value="unknown">不明・未入力</option>
                    <option value="in">成功</option>
                    <option value="out">失敗</option>
                </select>
            </div>
        </div>
        
        <!-- ミスの詳細記録 -->
         <div class="error-input">
            <label>
                <input type="checkbox" id="record-error">
                ミスの詳細を記録する
            </label>
            
            <div id="error-details" hidden>
                <label for="error-player">ミスした選手</label>
                <select id="error-player">
                    <option value="A">選手A</option>
                    <option value="B">選手B</option>
                </select>
                
                <label for="shot">ショットの種類</label>
                <select id="shot">
                    <option value="stroke">ストローク</option>
                    <option value="volley">ボレー</option>
                    <option value="smash">スマッシュ</option>
                </select>
                
                <div id="hand-area">
                    <label for="hand">フォア・バック</label>
                    <select id="hand">
                        <option value="fore">フォア</option>
                        <option value="back">バック</option>
                    </select>
                </div>
                
                <label for="error-type">ミスの種類</label>
                <select id="error-type">
                    <option value="net">ネット</option>
                    <option value="side">サイドアウト</option>
                    <option value="back">バックアウト</option>
                </select>
            </div>
        </div>

        
        <button id="own-point-button">自ペア得点</button>
        <button id="opponent-point-button">相手ペア得点</button>
        <button id="undo-button">1ポイント取り消す</button>
        <button id="analysis-button">分析結果を見る</button>
        <button id="match-list-button">過去の試合を見る</button>
        <button id="growth-button">成長分析を見る</button>
        <button id="backup-button">データ管理</button>
        <button id="finish-button">試合終了</button>
        <button id="new-match-button">新しい試合を始める</button>
    </section>
    
    <!-- 分析画面 -->
     <section id="analysis-screen" hidden>
        <h2>試合分析</h2>
        
        <h3>サーブ成功率</h3>
        <div id="serve-analysis"></div>

        <h3>選手別ミス数</h3>
        <div id="error-analysis"></div>
        <h3>選手別ミス数のグラフ</h3>
        <div id="error-chart"></div>

        
        <h3>ミスの種類別集計</h3>
        <div id="error-type-analysis"></div>

        <button id="back-button">記録画面に戻る</button>
    </section>

    <section id="match-list-screen" hidden>
        <h2>過去の試合一覧</h2>

        <div id="match-list"></div>

        <button id="list-back-button">
            記録画面に戻る
        </button>
    </section>
    
    <section id="growth-screen" hidden>
        <h2>選手別の成長分析</h2>

        <label for="growth-player">分析する選手</label>
        <select id="growth-player"></select>

        <div id="growth-results"></div>
        
        <h3>1stサーブ成功率の推移</h3>
        <div id="growth-chart"></div>
        
        <button id="growth-back-button">
            記録画面に戻る
        </button>
    </section>

    <section id="point-history-screen" hidden>
        <h2>ポイント履歴</h2>

        <p id="history-match-name"></p>

        <div id="point-history-list"></div>

        <button id="history-back-button">
            試合一覧に戻る
        </button>
    </section>


    <section id="point-edit-screen" hidden>
        <h2>ポイント記録の編集</h2>
        <p id="point-edit-title"></p>

        <label for="edit-winner">得点側</label>
        <select id="edit-winner">
            <option value="own">自分たち</option>
            <option value="opponent">相手</option>
        </select>

        <label for="edit-server">サーバー</label>
        <select id="edit-server">
            <option value="A">選手A</option>
            <option value="B">選手B</option>
            <option value="opponent">相手</option>
        </select>

        <label for="edit-first-serve">1stサーブ</label>
        <select id="edit-first-serve">
            <option value="unknown">不明</option>
            <option value="in">IN</option>
            <option value="out">OUT</option>
        </select>

        <div id="edit-second-serve-area">
            <label for="edit-second-serve">2ndサーブ</label>
            <select id="edit-second-serve">
                <option value="unknown">不明</option>
                <option value="in">IN</option>
                <option value="out">OUT</option>
            </select>
        </div>
    
        <div id="edit-error-area">
            <label for="edit-error-player">ミスした選手</label>
            <select id="edit-error-player">
                <option value="">記録なし</option>
                <option value="A">選手A</option>
                <option value="B">選手B</option>
            </select>

            <div id="edit-error-details">
                <label for="edit-shot">ショット</label>
                <select id="edit-shot">
                    <option value="">不明</option>
                    <option value="stroke">ストローク</option>
                    <option value="volley">ボレー</option>
                    <option value="smash">スマッシュ</option>
                </select>

                <div id="edit-hand-area">
                    <label for="edit-hand">フォア・バック</label>
                    <select id="edit-hand">
                        <option value="">不明</option>
                        <option value="fore">フォア</option>
                        <option value="back">バック</option>
                    </select>
                </div>

                <label for="edit-error-type">ミスの種類</label>
                <select id="edit-error-type">
                    <option value="">不明</option>
                    <option value="net">ネット</option>
                    <option value="side">サイドアウト</option>
                    <option value="back">バックアウト</option>
                </select>
            </div>
        </div>

    <button id="save-point-edit-button">変更を保存</button>
    <button id="cancel-point-edit-button">キャンセル</button>
</section>

<section id="point-edit-screen" hidden>
    <h2>ポイント記録の編集</h2>
    <p id="point-edit-title"></p>

    <label for="edit-winner">得点側</label>
    <select id="edit-winner">
        <option value="own">自分たち</option>
        <option value="opponent">相手</option>
    </select>

    <label for="edit-server">サーバー</label>
    <select id="edit-server">
        <option value="A">選手A</option>
        <option value="B">選手B</option>
        <option value="opponent">相手</option>
    </select>

    <label for="edit-first-serve">1stサーブ</label>
    <select id="edit-first-serve">
        <option value="unknown">不明</option>
        <option value="in">IN</option>
        <option value="out">OUT</option>
    </select>

    <div id="edit-second-serve-area">
        <label for="edit-second-serve">2ndサーブ</label>
        <select id="edit-second-serve">
            <option value="unknown">不明</option>
            <option value="in">IN</option>
            <option value="out">OUT</option>
        </select>
    </div>

    <div id="edit-error-area">
        <label for="edit-error-player">ミスした選手</label>
        <select id="edit-error-player">
            <option value="">記録なし</option>
            <option value="A">選手A</option>
            <option value="B">選手B</option>
        </select>

        <div id="edit-error-details">
            <label for="edit-shot">ショット</label>
            <select id="edit-shot">
                <option value="">不明</option>
                <option value="stroke">ストローク</option>
                <option value="volley">ボレー</option>
                <option value="smash">スマッシュ</option>
            </select>

            <div id="edit-hand-area">
                <label for="edit-hand">フォア・バック</label>
                <select id="edit-hand">
                    <option value="">不明</option>
                    <option value="fore">フォア</option>
                    <option value="back">バック</option>
                </select>
            </div>

            <label for="edit-error-type">ミスの種類</label>
            <select id="edit-error-type">
                <option value="">不明</option>
                <option value="net">ネット</option>
                <option value="side">サイドアウト</option>
                <option value="back">バックアウト</option>
            </select>
        </div>
    </div>

    <button id="save-point-edit-button">変更を保存</button>
    <button id="cancel-point-edit-button">キャンセル</button>
</section>


<section id="backup-screen" hidden>
    <h2>データ管理</h2>

    <p>保存済みの試合データをバックアップできます。</p>

    <button id="export-button">
        バックアップを保存
    </button>

    <h3>バックアップから復元</h3>

    <p>
        注意：復元すると、現在保存されている
        すべての試合データが置き換わります。
    </p>

    <input
        type="file"
        id="import-file"
        accept=".json,application/json"
    >

    <button id="import-button">
        ファイルから復元
    </button>

    <button id="backup-back-button">
        記録画面に戻る
    </button>
</section>

    <script src="script.js"></script>
</body>
</html>
